name: Greenhouse diagnostic (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Greenhouse API from this runner
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time, socket
          print("runner egress IP:", urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode())
          probes = [
            ("stripe",   "Mozilla/5.0 (compatible; greenhouse-nologin-scraper/1.0)"),
            ("stripe",   "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
            ("airbnb",   "Mozilla/5.0 (compatible; greenhouse-nologin-scraper/1.0)"),
            ("databricks", "Mozilla/5.0 (compatible; greenhouse-nologin-scraper/1.0)"),
            ("stripe",   "python-urllib"),
          ]
          for slug, ua in probes:
            url = f"https://boards-api.greenhouse.io/v1/boards/{slug}/jobs"
            req = urllib.request.Request(url, headers={"User-Agent": ua})
            t = time.time()
            try:
                r = urllib.request.urlopen(req, timeout=20)
                body = r.read()
                status, hdrs = r.status, r.headers
            except urllib.error.HTTPError as e:
                body = e.read(); status, hdrs = e.code, e.headers
            except Exception as e:
                print(f"--- {slug} | UA={ua[:40]}\n  ERROR {type(e).__name__}: {e}"); continue
            print(f"--- {slug} | UA={ua[:45]} | {status} | {len(body)} bytes | {time.time()-t:.2f}s")
            for k in ("server","via","cf-ray","cf-cache-status","x-cache","x-served-by","retry-after","x-ratelimit-limit","x-ratelimit-remaining","x-amz-cf-pop","content-type","x-request-id"):
                if hdrs.get(k): print(f"  {k}: {hdrs.get(k)}")
            if status != 200: print("  body:", body[:400].decode("utf-8","replace").replace("\n"," "))
            time.sleep(2)
          PY
