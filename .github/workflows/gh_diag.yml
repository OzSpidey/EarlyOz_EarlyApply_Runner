name: Greenhouse diagnostic (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private code (board list; never printed)
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/EarlyOz_EarlyApply
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Ramp concurrency and capture block responses
        run: |
          python - <<'PY'
          import json, random, threading, time, requests
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          boards = json.load(open("companies/greenhouse.json", encoding="utf-8"))
          dead = set(json.load(open("companies/greenhouse_dead.json")))
          slugs = [s for s in boards if s not in dead]
          random.seed(7); random.shuffle(slugs)
          local = threading.local()
          samples = {}
          def sess():
              if not hasattr(local, "s"):
                  local.s = requests.Session()
                  local.s.headers["User-Agent"] = "Mozilla/5.0 (compatible; earlyoz-greenhouse/1.0)"
              return local.s
          def hit(slug):
              try:
                  r = sess().get(f"https://boards-api.greenhouse.io/v1/boards/{slug}/jobs", timeout=15)
              except Exception as e:
                  return "error"
              c = r.status_code
              if c in (403, 429) and c not in samples:
                  samples[c] = (dict((k, v) for k, v in r.headers.items()
                                if k.lower() in ("server","via","x-cache","retry-after","content-type","x-amzn-errortype","x-amz-cf-pop","x-ratelimit-limit","x-ratelimit-remaining","x-ratelimit-reset","cf-ray")),
                                r.text[:300].replace(slug, "<slug>"))
              return c
          from concurrent.futures import ThreadPoolExecutor as TPE
          pool = TPE(150)
          idx = 0
          time.sleep(90)   # cool-down from previous test
          for rate, dur in [(20, 30), (40, 30), (70, 30), (100, 30)]:
              futs, t0 = [], time.time()
              total = rate * dur
              for k in range(total):
                  target = t0 + k / rate
                  d = target - time.time()
                  if d > 0: time.sleep(d)
                  futs.append(pool.submit(hit, slugs[idx % len(slugs)])); idx += 1
              res = [f.result() for f in futs]
              cnt = Counter(res)
              print(f"rate {rate:3d}/s for {dur}s ({total} req, actual {total/(time.time()-t0):5.1f}/s): {dict(cnt)}", flush=True)
              if cnt.get(429, 0) + cnt.get(403, 0) > total * 0.05:
                  print("refusals above 5% at this rate; stopping ramp"); break
              time.sleep(60)
          for c, (h, b) in samples.items():
              print(f"\nSAMPLE {c} headers: {h}\nSAMPLE {c} body: {b}")
          PY
