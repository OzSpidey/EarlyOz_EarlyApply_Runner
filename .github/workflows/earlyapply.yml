name: EarlyOz EarlyApply

# Triggered by cron-job.org (workflow_dispatch). Every portal is scraped in its own
# parallel job, then one send job matches the pooled roles to each subscriber and emails them.
on:
  workflow_dispatch:
    inputs:
      only_email:
        description: "Test mode: run for this one subscriber email only (blank = everyone)"
        required: false
        default: ""
      max_age_days:
        description: "Test mode: look back this many days (blank = 1, or 3 on Mondays)"
        required: false
        default: ""
      greenhouse:
        description: "auto = by time of day (always on for only_email tests), yes = force on, no = skip"
        required: false
        default: "auto"

concurrency:
  group: earlyapply
  cancel-in-progress: false

env:
  EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  SHEET_ID:           ${{ secrets.SHEET_ID }}
  SHEET_GID:          ${{ secrets.SHEET_GID }}
  ONLY_EMAIL:         ${{ github.event.inputs.only_email }}
  MAX_AGE_DAYS:       ${{ github.event.inputs.max_age_days }}
  # Kill switch without a code change: set repo variable DISABLED_PORTALS (e.g. "amazon,apple")
  DISABLED_PORTALS:   ${{ vars.DISABLED_PORTALS }}

jobs:
  plan:
    name: plan portals
    runs-on: ubuntu-latest
    outputs:
      portals: ${{ steps.p.outputs.portals }}
      skipped: ${{ steps.p.outputs.skipped }}
    steps:
      - id: p
        # Greenhouse is the heavy portal (6.5k boards, ~1000 requests/min/IP limit), so it is split
        # into GREENHOUSE_SHARDS parallel jobs (default 3), one IP each. Hours (ET) come from repo
        # variable GREENHOUSE_HOURS_ET (currently every hour = every run).
        env:
          HOURS: ${{ vars.GREENHOUSE_HOURS_ET || '9,13,17' }}
          ONLY:  ${{ github.event.inputs.only_email }}
          GH:    ${{ github.event.inputs.greenhouse }}
          SHARDS: ${{ vars.GREENHOUSE_SHARDS || '3' }}
        run: |
          hour=$(TZ=America/New_York date +%-H)
          portals='["workday","lever","apple","ashby","amazon"'
          skipped=""
          if [ "$GH" = "yes" ] || { [ "$GH" != "no" ] && { [ -n "$ONLY" ] || echo ",$HOURS," | grep -q ",$hour,"; }; }; then
            for i in $(seq 1 "$SHARDS"); do
              portals="$portals,\"greenhouse-${i}of${SHARDS}\""
            done
          else
            skipped="greenhouse"
          fi
          portals="$portals]"
          echo "ET hour=$hour -> portals=$portals skipped=$skipped"
          echo "portals=$portals" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

  scrape:
    name: scrape ${{ matrix.portal }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        portal: ${{ fromJSON(needs.plan.outputs.portals) }}
    steps:
      - name: Check out private code
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/EarlyOz_EarlyApply
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.portal }}
        run: python scraper.py scrape ${{ matrix.portal }}

      - name: Upload job pool
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ matrix.portal }}
          path: out/${{ matrix.portal }}.json
          retention-days: 1
          if-no-files-found: error

  send:
    name: match and email
    needs: [plan, scrape]
    # run even if a portal's scrape job failed; the pool just misses that portal
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private code
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/EarlyOz_EarlyApply
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download job pools
        uses: actions/download-artifact@v4
        with:
          pattern: jobs-*
          path: out
          merge-multiple: true

      - name: Match roles and send emails
        env:
          # portals skipped by the plan are not flagged as failures
          DISABLED_PORTALS: ${{ vars.DISABLED_PORTALS }},${{ needs.plan.outputs.skipped }}
        run: python scraper.py send

      - name: Commit updated seen IDs back to the private repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen/ 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update seen job IDs [skip ci]"
          git pull --rebase origin master
          git push
